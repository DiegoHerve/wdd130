    <div>

            <nav>
                <div>
                    <a href="index.html">Home</a>

                    <a href="trips.html">Trips</a>
                    <a href="contact.html">Contact Us</a>
                </div>
            </nav>
        </header>
    </div>
    <main>
        <div class="tsarabe">
            <h1> Diego Rapids Rafting Company </h1>
                <p>14 Royal road, Riche terre Albion</p>
                <p> Antananarivo 103 - MADAGASCAR </p>
                <p>+261 34 63 912 55 / +261 38 45 912 55 </p>
                <p> diegorafting@gmail.go </p>
        </div>
        <div class="good-position">
            <div>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d29442.67957808909!2d47.44093122594996!3d-18.840877654571035!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x21f07de34f1f4eb3%3A0xdf110608bcc082f9!2sAntananarivo%2C%20Madagascar!5e0!3m2!1sen!2smu!4v1780832531198!5m2!1sen!2smu"
                    allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade">
                </iframe>
            </div>
            <form>
                <div>
                    <label for="name"> Name :</label>
                    <input type="text" id="name" name="name">
                </div>
                <div>
                    <label for="mail"> Mail :</label>
                    <input type="text" id="mail" name="mail">
                </div>

                <div>
                    <ul class="listing">
                        <li>
                            <p> Message purpose </p>
                        </li>
                        <li></li><input type="radio" id="inquiry" name="message-purpose"><label for="inquiry"> General
                            enquiry </label></li>

                        <li><input type="radio" id="reservation" name="message-purpose"><label for="reservation">
                                Reservation question </label></li>

                        <li>
                            <input type="radio" id="website-suggestion" name="message-purpose">
                            <label for="website-suggestion"> Website suggestion </label>
                        </li>
                    </ul>
                </div>
                <div>
                    <label for="message"> Message : </label>
                    <textarea id="textarea" name="message"></textarea>
                </div>
                <div>
                    <label><input type="checkbox" id="subscribe" name="subscribe"> Please subscribe me to the monthly
                        newsletter.</label>
                </div>
                <div class="place-well">
                    <button type="submit"><label> SUBMIT </label></button>
                </div>
            </form>
        </div>
        <section class="section-color">
            <p>We are here to serve you</p>
            <div class="staff-pc">
                <figure class="photo">
                    <img src="images/ramosetale.jpg" alt=" Mr Abraham, General manager" id="staff-pic">
                    <figcaption> Mr Arsen RODOLF, General manager</figcaption>
                </figure>
                <figure class="photo">
                    <img src="images/madamakely.jpg" alt=" Miss Amanda lea, HR Manager">
                    <figcaption> Miss Amanda LEA, HR manager</figcaption>
                </figure>
                <figure class="photo">
                    <img src="images/madamekelyok.jpg" alt="Mrs Anna lee, project manager">
                    <figcaption> Mrs Anna lee, Project manager</figcaption>
                </figure>
            </div>
        </section>

    </main>

        <p> &copy; 2026 | Diego Rapid Rafting | Jean Herve </p>
