<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="Welcome to Diego Rapids Rafting. Book your ultimate white water rafting adventure, river trips, and camping getaways.">
    <meta name="author" content="Jean Herve RAKOTOARIMALALA">
    <title>Diego Rapids Rafting - Home</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-crossedoars.jpeg" alt="Logo of the white water rafting organization">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <div class="hero">
            <img src="images/hero-imagetwo.jpg" alt="Thrilling white water rafting group adventure">
            <h1> Come on, let's go and rafting </h1>
            <article>
                <p class="hero-cta-text"> Enjoy the Adventure </p>
                <a href="trips.html" class="book-now-button"> Book Now </a>
            </article>
        </div>

        <section class="home-newsletter">
            <h2>Stay Updated on Adventures</h2>
            <form>
                <div class="input-group">
                    <label for="name">First Name:</label>
                    <input type="text" id="name" name="userName" required>
                </div>
                <div class="input-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="userEmail" required>
                </div>
                <button type="submit">Sign Up For Newsletter</button>
            </form>
        </section>

        <section>
            <h2>WHAT WE OFFER</h2>
            <div class="adventure-gallery">
                <figure class="adventure-card">
                    <img src="images/whitewaterone.jfif" alt="Rivers offering">
                    <figcaption> Narrow Rafting </figcaption>
                </figure>
                <figure class="adventure-card">
                    <img src="images/happy-camper.jpg" alt="Camping offering">
                    <figcaption> Half-day guided trips </figcaption>
                </figure>
                <figure class="adventure-card">
                    <img src="images/campingok.jfif" alt="Rapids offering">
                    <figcaption> Camping </figcaption>
                </figure>
                <figure class="adventure-card">
                    <img src="images/whitewaterthree.jfif" alt="Trips offering">
                    <figcaption>Trips</figcaption>
                </figure>
                <figure class="adventure-card">
                    <img src="images/team-building.jfif" alt=" team-building pic">
                    <figcaption>Team-building</figcaption>
                </figure>
            </div>
        </section>

        <section class="home-feature-section">
            <h2> An unforgettable adventure is waiting for you </h2>
            <div class="history-container">
                <div class="feature-text-block">
                    <p></p>
                </div>
                <img class="history-image" src="images/hero-imagetwo.jpg"
                  alt="Scenic canyon landscape view">
                <div class="feature-btn-block">
                    <p>Ready to Explore?</p>
                    <a href="trips.html" class="join-us-btn">Join Us</a>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <nav class="socialmedia">
            <a href="https://x.com"><img src="images/twitter.png" alt="Icon X"></a>
            <a href="https://facebook.com"><img src="images/facebook.png" alt="Icon facebook"></a>
            <a href="https://instagram.com"><img src="images/instagramok.jpg"
                  alt="Instagram icon"></a>
        </nav>
        <p>&copy; 2026 | Diego Rapids Rafting | Jean Herve RAKOTOARIMALALA</p>
    </footer>
</body>

</html>
